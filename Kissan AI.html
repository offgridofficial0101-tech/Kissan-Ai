<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kissan</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fbf4dc;--card:#fffdf4;--ink:#2b2a1a;--mute:#6f6a4c;--g1:#3b7d23;--g2:#27591a;--g3:#e3efc3;--user:#f2dfa8;--line:#e2d6a6;--gold:#e0a21b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16190e;--card:#20250f;--ink:#eef0d8;--mute:#aeb393;--g1:#8bc34a;--g2:#33691e;--g3:#2f3a17;--user:#4a4018;--line:#38401f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16190e;--card:#20250f;--ink:#eef0d8;--mute:#aeb393;--g1:#8bc34a;--g2:#33691e;--g3:#2f3a17;--user:#4a4018;--line:#38401f}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Devanagari","Mukta",system-ui,sans-serif;display:flex;flex-direction:column;font-size:16px;overflow:hidden}
header{background:linear-gradient(180deg,#f6c453 0,#a9c93f 38%,#3b7d23 100%);color:#fff;padding:8px 14px 0;position:relative}
.hr{display:flex;align-items:center;gap:10px}
.t{flex:1;line-height:1.05;text-shadow:0 1px 2px rgba(0,0,0,.35)}.t b{font-size:26px;letter-spacing:1px;font-family:Georgia,serif}.t small{display:block;font-size:12px}
.lang{display:flex;background:rgba(0,0,0,.25);border-radius:20px;padding:2px}
.lang button{border:0;background:none;color:#fff;padding:6px 11px;border-radius:18px;font:inherit;font-size:14px}
.lang button.on{background:#fff;color:var(--g2);font-weight:700}
.ic{border:0;background:rgba(0,0,0,.25);color:#fff;border-radius:50%;width:38px;height:38px;font-size:18px}
header svg.hill{display:block;width:calc(100% + 28px);margin:2px -14px 0;height:22px}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:9px 2px;font:inherit;font-size:13px;border-bottom:3px solid transparent}
nav button.on{color:var(--g1);border-color:var(--gold);font-weight:700}
.view{flex:1;display:none;flex-direction:column;min-height:0}.view.on{display:flex}
.scroll{overflow-y:auto;padding:14px;flex:1}
#panel{background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:none;gap:8px;flex-wrap:wrap}#panel.open{display:flex}
#panel label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:2px;flex:1 1 90px}
#panel select,#panel input{padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;width:100%}
.row{display:flex;gap:8px;width:100%;flex-wrap:wrap;align-items:center}
.pill{border:1px solid var(--g1);color:var(--g1);background:none;border-radius:18px;padding:7px 12px;font:inherit;font-size:14px}.pill.on{background:var(--g1);color:#fff}
.tools{display:flex;gap:8px;padding:8px 14px 0}
#chat{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:90%;padding:10px 13px;border-radius:16px;line-height:1.55;word-wrap:break-word}
.m.u{align-self:flex-end;background:var(--user);border-bottom-right-radius:4px}
.m.b{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.m img{max-width:200px;border-radius:10px;display:block;margin-bottom:6px}.m ul{margin:4px 0;padding-left:20px}
.spk{border:0;background:var(--g3);border-radius:14px;padding:3px 10px;font-size:14px;margin-top:4px}
.hero{text-align:center;padding:10px 6px;color:var(--mute)}.hero h2{color:var(--g1);margin:6px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid var(--g1);background:var(--g3);color:var(--ink);border-radius:16px;padding:7px 12px;font:inherit;font-size:14px;text-align:left}
.fu{align-self:flex-start;max-width:95%}.fu small{color:var(--mute)}
.bar{display:flex;gap:7px;padding:9px 10px;background:var(--card);border-top:1px solid var(--line);align-items:flex-end}
.bar textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:20px;padding:10px 14px;font:inherit;background:var(--bg);color:var(--ink);max-height:110px}
.bar button,.bar label{border:0;border-radius:50%;width:42px;height:42px;font-size:19px;background:var(--g3);color:var(--ink);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bar .go{background:var(--g1);color:#fff}.bar .rec{background:#d32f2f;color:#fff;animation:p 1s infinite}
@keyframes p{50%{opacity:.5}}
#prev{display:none;padding:6px 14px;background:var(--card);font-size:13px;color:var(--mute)}#prev img{height:44px;border-radius:8px;vertical-align:middle;margin-right:8px}
#st{font-size:12px;color:var(--mute);padding:0 14px 4px;background:var(--card);min-height:0}
#sp{display:none;gap:8px;padding:6px 12px;background:var(--g3);border-top:1px solid var(--line);align-items:center;font-size:13px}#sp.on{display:flex}#sp span{flex:1}#sp button{border:0;border-radius:16px;padding:7px 14px;font:inherit;font-size:14px;background:var(--g1);color:#fff}#sp button+button{background:#d32f2f}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--g1);animation:p 1s infinite}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 4px;color:var(--g1);font-size:17px}.card p{margin:4px 0;line-height:1.5;font-size:15px}
.mo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.mo button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 2px;font:inherit;font-size:13px}.mo button.on{background:var(--g1);color:#fff;border-color:var(--g1)}
#hist{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:5}#hist.open{display:block}
#hist>div{background:var(--card);width:85%;max-width:360px;height:100%;padding:14px;overflow-y:auto;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.hi{display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line)}.hi button:first-child{flex:1;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:10px 2px;font-size:15px}
.hi button+button{border:0;background:none;font-size:16px}
.gh{font-size:12px;color:var(--g1);font-weight:700;margin:12px 0 2px}
#gate{position:fixed;inset:0;z-index:20;background:linear-gradient(180deg,#f6c453,#a9c93f 45%,#3b7d23);display:flex;align-items:center;justify-content:center;padding:20px}#gate .gc{background:var(--card);border-radius:20px;padding:22px;width:100%;max-width:360px;text-align:center}#gate input{width:100%;padding:12px;font-size:20px;text-align:center;letter-spacing:3px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin:10px 0}#gate .big{width:100%;padding:12px;border:0;border-radius:24px;background:var(--g1);color:#fff;font:inherit;font-size:17px}#gotp{font-size:24px;font-weight:700;color:var(--g1);background:var(--g3);border-radius:12px;padding:10px;margin:8px 0;letter-spacing:4px}#gerr{color:#d32f2f;font-size:13px;min-height:18px}
</style>
</head>
<body>
<div id="gate"><div class="gc"><div style="font-size:46px">🌱</div><h2 style="font-family:Georgia,serif;color:var(--g1);margin:4px 0">Kissan AI</h2>

<h3 id="gt" style="margin:6px 0"></h3><p id="gs" style="color:var(--mute);margin:4px 0"></p>

<div id="g2" style="display:none"><div id="gotp"></div><input id="gin" type="tel" inputmode="numeric" maxlength="4" placeholder="• • • •"><button class="big" id="gok"></button><button class="pill" id="gback" style="margin-top:10px"></button></div>
<div id="gerr"></div></div></div>
<header>
  <div class="hr">
    <svg width="46" height="46" viewBox="0 0 64 64" aria-label="Kissan logo"><circle cx="32" cy="32" r="30" fill="#fffdf4"/><circle cx="46" cy="16" r="7" fill="#f6c453"/><path d="M6 46c9-7 19-7 26-2 7-5 17-5 26 2v12H6z" fill="#8a5a2b"/><path d="M12 50h40M12 55h40" stroke="#b9854a" stroke-width="1.5"/><path d="M32 46V28" stroke="#27591a" stroke-width="3" stroke-linecap="round"/><path d="M32 31C32 21 24 15 13 16c0 10 8 16 19 15z" fill="#3b7d23"/><path d="M32 27c0-9 7-15 18-14 0 9-8 15-18 14z" fill="#8bc34a"/></svg>
    <div class="t"><b>Kissan</b><small id="tag"></small></div>
    <div class="lang"><button id="lm" class="on">मराठी</button><button id="lh">हिंदी</button></div>
    <button class="ic" id="tg">⚙️</button>
  </div>
  <svg class="hill" viewBox="0 0 400 22" preserveAspectRatio="none"><path d="M0 22V12C60 0 110 4 170 12s120 2 230-8v18z" fill="var(--bg)"/></svg>
</header>
<div id="panel">
  <div class="row"><label><span id="l_soil"></span><select id="soil"></select></label><label><span id="l_loc"></span><input id="loc"></label></div>
  <div class="row"><label>🌡️ °C<input id="temp" type="number" inputmode="decimal"></label><label>💧 %<input id="hum" type="number" inputmode="decimal"></label><label>💨 km/h<input id="wind" type="number" inputmode="decimal"></label></div>
  <div class="row"><button class="pill" id="gps"></button><button class="pill" id="ntf"></button><button class="pill on" id="vo"></button></div>
  <div id="note" style="font-size:12px;color:var(--mute);width:100%"></div>
</div>
<nav><button data-v="c" class="on" id="n_c"></button><button data-v="k" id="n_k"></button><button data-v="s" id="n_s"></button><button data-v="a" id="n_a"></button></nav>

<section class="view on" id="v_c">
  <div class="tools"><button class="pill" id="nw"></button><button class="pill" id="hb"></button></div>
  <div id="chat"></div><div id="prev"></div><div id="sp"><span id="spl">🔊</span><button id="spp"></button><button id="sps"></button></div><div id="st"></div>
  <div class="bar">
    <label title="Camera">📷<input type="file" id="f1" accept="image/*" capture="environment" hidden></label>
    <label title="Gallery">🖼️<input type="file" id="f2" accept="image/*" hidden></label>
    <button id="mic">🎤</button><textarea id="in" rows="1"></textarea><button class="go" id="send">➤</button>
  </div>
</section>
<section class="view" id="v_k"><div class="scroll"><div class="mo" id="mo"></div><div id="kc"></div></div></section>
<section class="view" id="v_s"><div class="scroll" id="sc"></div></section>
<section class="view" id="v_a"><div class="scroll" id="ab"></div></section>
<div id="hist"><div id="hl"></div></div>

/* chat */
function ctx(){const p=[];if($("soil").value)p.push("Soil: "+$("soil").value);if($("loc").value)p.push("Location: "+$("loc").value);if(coords)p.push(`GPS: ${coords.lat.toFixed(3)}, ${coords.lon.toFixed(3)}`);
 if($("temp").value)p.push("Temperature: "+$("temp").value+"°C");if($("hum").value)p.push("Humidity: "+$("hum").value+"%");if($("wind").value)p.push("Wind: "+$("wind").value+" km/h");
 p.push("Today: "+new Date().toLocaleDateString("en-IN",{dateStyle:"full"}));return p.join("; ")}
const SYS=()=>`You are Kissan, a friendly, practical AI farming advisor for Indian farmers (the app name is always written in English: "Kissan"). If asked who founded/made this app, say the founder is ${FOUNDER}. For customer support, give the email ${MAIL}. Reply ONLY in ${T().sys}, in simple village-friendly spoken words (your answer may be read aloud), short bullet points, few emojis. Cover as relevant: suitable crop for soil/season/month/weather, sowing time, growth duration & harvest time, fertilizer (chemical doses per acre AND natural/organic options like compost, vermicompost, jeevamrut, neem cake), spraying/pest & disease schedule (organic first), irrigation, fruit & vegetable care, market price (bajar bhav) as a typical APPROXIMATE RANGE (see MARKET RULE below), government schemes and how to apply (PM-Kisan, PMFBY, KCC, MahaDBT, Soil Health Card, PM-KUSUM, eNAM; tell to verify at official site/Krishi office), and AI/technology tips (photo diagnosis, soil testing, drip irrigation, weather apps, drones). If a photo is given, identify the crop, visible problem and treatment. Ask briefly for missing info if essential. MARKET RULE: whenever the farmer asks about bajar bhav / mandi price / rate of any crop, fruit or vegetable, ALWAYS answer with a typical approximate range from your knowledge, like 'साधारण ₹X – ₹Y प्रति क्विंटल' (and ₹/kg for fruits and vegetables), plus 1-2 lines on what makes the rate go up or down (season, quality, demand, mandi) and the best time to sell. If no crop is named, give ranges for 6-8 common crops of the current season (e.g. soybean, cotton, tur, onion, wheat, gram, tomato). Never refuse and never ask which crop first. Say once, briefly, that it is an estimate, not today's live rate, and the exact rate can be checked at the local mandi, eNAM or Agmarknet. Never invent weather. Mention PPE and label doses for chemicals. At the very end add one line exactly: FOLLOWUP: question1 | question2 | question3 (three short next questions the farmer may ask, same language).
Farmer context: ${ctx()}`;
/* speech out */
function speak(text){try{const s=speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[*#_`]/g,"").replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu,"").replace(/https?:\/\/\S+/g,""));
 const code=lg=="mr"?"mr-IN":"hi-IN";u.lang=code;const vs=s.getVoices();const v=vs.find(x=>x.lang.replace("_","-")==code)||vs.find(x=>x.lang.startsWith(lg=="mr"?"mr":"hi"))||vs.find(x=>x.lang.startsWith("hi"));if(v)u.voice=v;u.rate=.92;u.onstart=()=>spUI(true);u.onend=u.onerror=()=>spUI(false);s.speak(u)}catch(e){}}
let paused=false;
function spUI(v){paused=false;$("sp").classList.toggle("on",v);if(v){$("spl").textContent="🔊 "+(lg=="mr"?"AI बोलत आहे…":"AI बोल रहा है…");$("spp").textContent=lg=="mr"?"⏸️ थांबवा":"⏸️ रोकें";$("sps").textContent=lg=="mr"?"⏹️ बंद":"⏹️ बंद"}}
$("spp").onclick=()=>{try{if(paused){speechSynthesis.resume();paused=false;$("spp").textContent=lg=="mr"?"⏸️ थांबवा":"⏸️ रोकें"}else{speechSynthesis.pause();paused=true;$("spp").textContent=lg=="mr"?"▶️ सुरू करा":"▶️ चालू करें"}}catch(e){}};
$("sps").onclick=()=>{try{speechSynthesis.cancel()}catch(e){}spUI(false)};
async function ask(text){
 text=(text||"").trim();if((!text&&!img)||busy)return;
 if(!cur)cur={id:"c"+Date.now(),t:""};if(!hist.length)chat.innerHTML="";if(!cur.t)cur.t=(text||"📷").slice(0,40);
 const f=img,vv=viaVoice;img=null;viaVoice=false;$("prev").style.display="none";$("in").value="";
 add("u",(f?`<img src="${URL.createObjectURL(f)}">`:"")+esc(text||"📷"));
 const b=add("b",`<span class="dots"><span></span><span></span><span></span></span> ${T().wait}`);busy=true;
 try{
  sample=sample||await claude.use("sample");if(!sample)throw 0;
  const msgs=hist.slice(-8).concat([{role:"user",content:SYS()+"\n\nQuestion: "+(text||"Please analyse this photo.")}]);
  const o={cache:false,onText:({text:t})=>{b.innerHTML=md(t.replace(/FOLLOWUP:[\s\S]*$/,""));chat.scrollTop=chat.scrollHeight}};
  if(f){const lim=await sample.limits();if(lim&&lim.images)o.images=[f]}
  const r=await sample(msgs,o);let ans=r.text,fu=[];
  const m=ans.match(/FOLLOWUP:\s*([\s\S]*)$/);if(m){fu=m[1].split("|").map(s=>s.trim().replace(/^[-\d.\s]+/,"")).filter(Boolean).slice(0,3);ans=ans.slice(0,m.index).trim()}
  b.innerHTML=md(ans);const sp=document.createElement("button");sp.className="spk";sp.textContent="🔊";sp.onclick=()=>speak(ans);b.appendChild(sp);
  hist.push({role:"user",content:text||"(photo)"},{role:"assistant",content:ans});save();if(vv&&speakOn)speak(ans);
  if(fu.length){const d=add("fu",`<small>${T().fu}</small><div class="chips">${fu.map(q=>`<button class="chip">${esc(q)}</button>`).join("")}</div>`);d.className="fu";d.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{d.remove();ask(c.textContent)})}
 }catch(e){b.textContent=T().err}
 busy=false;chat.scrollTop=chat.scrollHeight}
$("send").onclick=()=>ask($("in").value);
$("in").onkeydown=e=>{if(e.key=="Enter"&&!e.shiftKey){e.preventDefault();ask($("in").value)}};
$("lm").onclick=()=>{lg="mr";ui()};$("lh").onclick=()=>{lg="hi";ui()};
$("tg").onclick=()=>$("panel").classList.toggle("open");
$("nw").onclick=newChat;$("hb").onclick=openHist;
$("vo").onclick=()=>{speakOn=!speakOn;$("vo").classList.toggle("on",speakOn);if(!speakOn)try{speechSynthesis.cancel()}catch(e){}};
function pick(e){const f=e.target.files[0];if(!f)return;img=f;const p=$("prev");p.style.display="block";p.innerHTML=`<img src="${URL.createObjectURL(f)}">📷 ✔`;e.target.value=""}
$("f1").onchange=pick;$("f2").onchange=pick;
/* voice in */
let dict=null,rec=null,on=false;const st=m=>{$("st").textContent=m||""};
function setRec(v){on=v;$("mic").classList.toggle("rec",v);st(v?T().lis:"")}
try{claude.use("dictation").then(d=>{dict=d;if(d){d.onFinal(({text})=>{$("in").value=($("in").value+" "+text).trim();viaVoice=true});d.onPartial(({text})=>{st("🎤 "+text)});d.onState(({state})=>{setRec(state=="listening");if(state!="listening"&&viaVoice&&$("in").value.trim())setTimeout(()=>{if(!busy)ask($("in").value)},400)})}}).catch(()=>{})}catch(e){}
$("mic").onclick=()=>{
 try{speechSynthesis.cancel()}catch(e){}
 if(dict){if(on){dict.stop().catch(()=>{});return}
  viaVoice=true;dict.start().catch(e=>{setRec(false);st(T().nov)});return}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){st(T().nov);return}
 if(on&&rec){rec.stop();return}
 rec=new SR();rec.lang=lg=="mr"?"mr-IN":"hi-IN";rec.interimResults=false;
 rec.onresult=e=>{$("in").value=($("in").value+" "+e.results[0][0].transcript).trim();viaVoice=true;setTimeout(()=>{if(!busy)ask($("in").value)},300)};
 rec.onstart=()=>setRec(true);rec.onend=()=>setRec(false);rec.onerror=e=>{setRec(false);st(T().nov+" ("+(e.error||"")+")")};
 try{rec.start()}catch(e){st(T().nov)}};
/* location + notifications */
$("gps").onclick=()=>{if(!navigator.geolocation){$("note").textContent=T().loc_no;return}
 navigator.geolocation.getCurrentPosition(p=>{coords={lat:p.coords.latitude,lon:p.coords.longitude};if(!$("loc").value)$("loc").value=coords.lat.toFixed(2)+", "+coords.lon.toFixed(2);$("note").textContent=T().loc_ok},()=>{$("note").textContent=T().loc_no},{timeout:10000})};
let nOn=false,last="";
$("ntf").onclick=async()=>{try{const r=await Notification.requestPermission();if(r=="granted"){nOn=true;$("ntf").classList.add("on");$("note").textContent=T().nton;new Notification("Kissan 🌱",{body:T().tip})}else $("note").textContent=T().ntoff}catch(e){$("note").textContent=T().ntoff}};
setInterval(()=>{if(!nOn)return;const d=new Date(),k=d.toDateString();if(d.getHours()==7&&d.getMinutes()==0&&last!=k){last=k;try{new Notification("Kissan 🌱",{body:T().tip+": "+T().chips[Math.floor(Math.random()*5)]})}catch(e){}}},30000);
try{speechSynthesis.getVoices()}catch(e){}
function getUser(){try{return localStorage.getItem("kissan:user")}catch(e){return null}}
let otp=null,ph="";const gt=(m,h)=>lg=="mr"?m:h;
function gateUI(){$("g1").style.display=otp?"none":"block";$("g2").style.display=otp?"block":"none";
 $("gt").textContent=gt("शेतकरी मित्रांचे स्वागत! 🌾","किसान मित्रों का स्वागत! 🌾");
 $("gs").textContent=otp?gt("तुमचा OTP खाली दाखवला आहे, तो टाका.","आपका OTP नीचे दिखाया गया है, उसे डालें।"):gt("सुरू करण्यासाठी मोबाइल नंबर टाका","शुरू करने के लिए मोबाइल नंबर डालें");
 $("gsend").textContent=gt("OTP मिळवा","OTP पाएँ");$("gok").textContent=gt("तपासा आणि सुरू करा","जाँचें और शुरू करें");$("gback").textContent=gt("← नंबर बदला","← नंबर बदलें");
 $("gotp").style.display=otp?"block":"none";$("gotp").textContent=otp?(gt("OTP: ","OTP: ")+otp):""}
$("gm").onclick=()=>{lg="mr";ui();gateUI()};$("gh").onclick=()=>{lg="hi";ui();gateUI()};
$("gsend").onclick=()=>{const v=$("gph").value.replace(/\D/g,"");if(!/^[6-9]\d{9}$/.test(v)){$("gerr").textContent=gt("कृपया १० अंकी बरोबर मोबाइल नंबर टाका","कृपया सही 10 अंकों का मोबाइल नंबर डालें");return}
 ph=v;otp=String(1000+(crypto.getRandomValues(new Uint16Array(1))[0]%9000));$("gerr").textContent="";$("gin").value="";gateUI()};
$("gok").onclick=()=>{if($("gin").value.trim()==otp){try{localStorage.setItem("kissan:user",ph)}catch(e){}K="kissan:chats:"+ph;$("gate").style.display="none";otp=null;newChat();about()}else $("gerr").textContent=gt("OTP चुकीचा आहे","OTP गलत है")};
$("gback").onclick=()=>{otp=null;$("gerr").textContent="";gateUI()};
function logout(){try{localStorage.removeItem("kissan:user")}catch(e){}K="kissan:chats";hist=[];otp=null;$("gph").value="";$("gate").style.display="flex";gateUI()}
cur={id:"c"+Date.now(),t:""};ui();
const u0=getUser();if(u0){K="kissan:chats:"+u0;$("gate").style.display="none"}else gateUI();
</script>
</body>
</html>
